[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-trading-window-dashboard"
version = "0.1.0"
description = "Analyse Meta Platforms stock returns and volatility inside employee open trading windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.24",
    "requests>=2.32",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["meta_windows*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
